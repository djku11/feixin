<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07C160">

<!-- ===== iOS 添加到主屏幕（PWA）必需配置 ===== -->
<!-- 1. 让 Safari 以全屏独立窗口打开，而不是包一层浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 2. 状态栏样式：default=白底黑字 / black-translucent=内容延伸到刘海下 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 3. 添加到主屏幕后的图标下方名字（iOS 限制最多约 6 个汉字） -->
<meta name="apple-mobile-web-app-title" content="微聊">
<meta name="mobile-web-app-capable" content="yes">
<!-- 4. iOS 不读 manifest 里的图标，必须用 apple-touch-icon，且不支持透明像素 -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 5. iOS 启动画面（可选，避免打开时白屏） -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>微聊 · 分类聊天</title>
<link rel="stylesheet" href="css/app.css">
<!-- 真机全屏布局样式：
     · 电脑浏览器里看 → 保留手机外壳（不加这行）
     · 装到手机桌面（PWA 全屏）→ 自动加上这行，去掉假外壳、适配刘海
     · 打包成原生 App → 见 build-apk.bat，会自动取消注释 -->
<!-- <link rel="stylesheet" href="css/native.css"> -->
<script>
/* 智能判断运行环境：
   1) PWA 独立窗口（iOS 添加到主屏幕 / 安卓安装的 PWA / 华为添加到桌面）
      → navigator.standalone 或 display-mode: standalone
   2) 原生 App 壳（Capacitor 打包）→ 协议是 https 且带 Capacitor 标记
   满足任一条件就加载 native.css，让界面铺满整屏、避开刘海和手势条。 */
(function () {
  function isStandalone() {
    try {
      if (window.navigator.standalone === true) return true;              // iOS Safari
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
      if (window.matchMedia && window.matchMedia('(display-mode: minimal-ui)').matches) return true;
    } catch (e) {}
    return false;
  }
  if (isStandalone()) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'css/native.css';
    document.head.appendChild(l);
    document.documentElement.classList.add('standalone');
  }
})();
</script>
</head>
<body>
<div id="app">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span id="clock">9:41</span>
      <span class="sb-r">
        <svg viewBox="0 0 20 14" fill="currentColor"><rect y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" width="3" height="14" rx="1" opacity=".3"/></svg>
        <svg viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="21" height="12" rx="3.5" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M23.5 4.5v4c1-.4 1.5-1 1.5-2s-.5-1.6-1.5-2z" fill="currentColor" fill-opacity=".45"/></svg>
      </span>
    </div>
    <div id="view" class="view"></div>
    <div id="tabbar"></div>
  </div>
  <div class="hud" id="hud"></div>
</div>
<script src="js/store.js"></script>
<script src="js/media.js"></script>
<script src="js/screens1.js"></script>
<script src="js/screens2.js"></script>
<script src="js/screens3.js"></script>
<script src="js/app.js"></script>
<!-- 交互增强补丁：分类拖拽排序 / 好友左滑管理 / 备注编辑 -->
<script src="js/enhance.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 本地 file:// 打开时忽略 */ });
  });
}
</script>
</body>
</html>
